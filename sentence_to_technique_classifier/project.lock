convert:
  cmd: python -m weasel run convert
  script:
    - python scripts/convert.py en assets/train_test_splits/train_selected120_split_0.jsonl
      corpus/train.spacy
    - python scripts/convert.py en assets/train_test_splits/test_selected120_split_0.jsonl
      corpus/dev.spacy
  deps:
    - path: assets/train_test_splits/train_selected120_split_0.jsonl
      md5: 687fd5637d699170ea534c9291562eeb
    - path: assets/train_test_splits/test_selected120_split_0.jsonl
      md5: ebae85f0b81664e2466c84be0938d16f
    - path: scripts/convert.py
      md5: 35ee9ecddb27d1dbf74d9bc36fb44d0b
  outs:
    - path: corpus/train.spacy
      md5: f4aab761cccafc30c96f141a14ea3817
    - path: corpus/dev.spacy
      md5: 4155e915938570c74bd75fc6849bccfe
train:
  cmd: python -m weasel run train
  script:
    - python -m spacy train configs/config-roberta-cti.cfg --output bagging_models/robertaCtiAll-final
      --paths.train corpus/train.spacy --paths.dev corpus/dev.spacy --nlp.lang en
      --gpu-id 0
  deps:
    - path: configs/config-roberta-cti.cfg
      md5: 93d693df4f447d008762b6168a980173
    - path: corpus/train.spacy
      md5: f4aab761cccafc30c96f141a14ea3817
    - path: corpus/dev.spacy
      md5: 4155e915938570c74bd75fc6849bccfe
  outs:
    - path: bagging_models/robertaCtiAll-final/model-best
      md5: 67b22dce28e8720b162b418003b62051
evaluate:
  cmd: python -m weasel run evaluate
  script:
    - python -m spacy evaluate bagging_models/robertaCtiAll-final/model-best corpus/dev.spacy
      --output bagging_models/robertaCtiAll-final/metrics.json
  deps:
    - path: corpus/dev.spacy
      md5: 4155e915938570c74bd75fc6849bccfe
    - path: bagging_models/robertaCtiAll-final/model-best
      md5: 67b22dce28e8720b162b418003b62051
  outs:
    - path: bagging_models/robertaCtiAll-final/metrics.json
      md5: 951c7eff809e3756f75bad14ebca6728
package:
  cmd: python -m weasel run package
  script:
    - python -m spacy package bagging_models/robertaCtiAll-final/model-best packages
      --name textcat_multilabel_demo --version 0.0.0 --force
  deps:
    - path: bagging_models/robertaCtiAll-final/model-best
      md5: 67b22dce28e8720b162b418003b62051
  outs:
    - path: packages/en_textcat_multilabel_demo-0.0.0/dist/en_textcat_multilabel_demo-0.0.0.tar.gz
      md5: 69ad84b663910e6e45232654ffb61ef6
